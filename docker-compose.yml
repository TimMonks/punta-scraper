services:
  digisnow-scraper:
    image: ghcr.io/timmonks/punta-scraper:${APP_IMAGE_TAG:-latest}
    build: .
    container_name: digisnow-scraper
    restart: unless-stopped
    expose:
      - "8099"
    volumes:
      - ./data:/app/app/data
    environment:
      - HA_MQTT_HOST=${HA_MQTT_HOST:-}
      - HA_MQTT_PORT=${HA_MQTT_PORT:-1883}
      - HA_MQTT_USERNAME=${HA_MQTT_USERNAME:-}
      - HA_MQTT_PASSWORD=${HA_MQTT_PASSWORD:-}
      - SECRET_KEY=${SECRET_KEY:-}
      - TZ=${TZ:-Europe/Paris}
      - LOG_FORMAT=${LOG_FORMAT:-json}
      - OIDC_CLIENT_ID=${OIDC_CLIENT_ID:-}
      - OIDC_CLIENT_SECRET=${OIDC_CLIENT_SECRET:-}
      - OIDC_ISSUER=${OIDC_ISSUER:-}
      - OIDC_REDIRECT_URI=${OIDC_REDIRECT_URI:-}
      - OIDC_END_SESSION_URL=${OIDC_END_SESSION_URL:-}
      - OIDC_ADMIN_GROUP=${OIDC_ADMIN_GROUP:-authentik Admins}
    # Web liveness via the unauthenticated /api/health route. It answers 200 even
    # when DigiSnow or MQTT is disconnected; those states are in its JSON and logs.
    # The image is python:3.12-slim (no curl), so the check uses Python itself.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8099/api/health', timeout=5)"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
      - "logging=digisnow"
    networks:
      - web

networks:
  web:
    external: true
